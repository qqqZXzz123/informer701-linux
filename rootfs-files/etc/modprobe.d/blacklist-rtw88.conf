# Исключаем конфликт между внешним двухдиапазонным драйвером 88x2bu.ko
# (клиент + точка доступа hostapd 2.4/5 ГГц для Realtek RTL8812BU/RTL8822BU)
# и штатными модулями rtw88 ядра Linux 6.2+.
blacklist rtw88_8822bu
blacklist rtw88_8822b
blacklist rtw88_usb

# Оптимальные параметры 88x2bu для хост-порта USB 2.0 (EHCI) платы Allwinner A10:
# - rtw_switch_usb_mode=0: не пытаться переключаться в USB 3.0;
# - rtw_enusbss=0, rtw_power_mgnt=0: отключить USB autosuspend и энергосбережение
#   для стабильной работы 24/7 в режимах клиента и точки доступа (hostapd).
options 88x2bu rtw_switch_usb_mode=0 rtw_enusbss=0 rtw_power_mgnt=0 rtw_led_ctrl=1
