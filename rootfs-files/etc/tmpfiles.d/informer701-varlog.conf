# Recreate volatile /var/log structure on tmpfs at every boot
d /var/log/apt 0755 root root -
d /var/log/private 0700 root root -
f /var/log/dpkg.log 0644 root root -
f /var/log/alternatives.log 0644 root root -
f /var/log/wtmp 0664 root utmp -
f /var/log/btmp 0660 root utmp -
f /var/log/lastlog 0664 root utmp -
d /run/wpa_supplicant 0750 root root -
